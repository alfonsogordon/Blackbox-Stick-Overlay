name: Windows standalone build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
      - name: Compile official Betaflight Blackbox decoder
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/betaflight/blackbox-tools.git blackbox-tools
          cd blackbox-tools
          make obj/blackbox_decode CC=gcc CFLAGS="-std=gnu99 -O2 -pthread -Isrc" LDFLAGS="-static -lm -pthread"
          cp obj/blackbox_decode.exe ../blackbox_decode.exe
      - name: Install Python build dependencies (runner only)
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Package GUI and compiled decoder
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --onedir --name BlackboxStickOverlay --add-binary "blackbox_decode.exe;." app.py
      - name: Decoder and app smoke test
        shell: pwsh
        run: |
          $usage = & ".\dist\BlackboxStickOverlay\_internal\blackbox_decode.exe" --help 2>&1 | Out-String
          if ($usage -notmatch "Usage:" -or $usage -notmatch "blackbox") { throw "Decoder smoke test failed: help output missing" }
          Write-Host "Decoder responded with expected usage text."
          # blackbox_decode intentionally returns nonzero for --help; GitHub pwsh checks LASTEXITCODE at script exit.
          $global:LASTEXITCODE = 0
          if (!(Test-Path ".\dist\BlackboxStickOverlay\BlackboxStickOverlay.exe")) { throw "Missing app executable" }
      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BlackboxStickOverlay-Windows
          path: dist/BlackboxStickOverlay/
