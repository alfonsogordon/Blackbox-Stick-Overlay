name: Deploy Web Overlay Studio
# Fresh Pages retry for v1.0.2 after GitHub server-side deployment lock (2026-11-13).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: web-overlay-deployment-v2
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle Betaflight browser decoder
        shell: bash
        run: |
          mkdir -p web/vendor
          # These external downloads occasionally fail transiently on GitHub-hosted runners.
          for attempt in 1 2 3; do
            if git clone --depth 1 https://github.com/betaflight/blackbox-log-viewer.git web/vendor/blackbox; then
              break
            fi
            rm -rf web/vendor/blackbox
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          cd web/vendor/blackbox
          # Install only the parser's build dependencies, not Explorer's entire app.
          printf '%s\n' '{"private":true,"type":"module","dependencies":{"semver":"^7.7.4","esbuild":"^0.25.0","pinia":"^3.0.4","vue":"^3.5.44"}}' > package.json
          for attempt in 1 2 3; do
            if npm install --no-package-lock --no-audit --no-fund; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          ./node_modules/.bin/esbuild ../../decoder-entry.js --bundle --format=esm --platform=browser --outfile=../../decoder-bundle.js
          cp LICENSE ../../BETAFLLIGHT-GPL-LICENSE.txt
          cd ../..
          rm -rf vendor
      - uses: actions/configure-pages@v5
      # One-time recovery: a GitHub Pages 502 left the old deployment locked.
      # Uses the existing job token (pages: write); no user CLI/token needed.
      - name: Cancel stuck v1.0.2 Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/5581e5c6472cbb4fb8790dfc82c8603b0c4ea4c2/cancel")"
          if [ "$status" = "204" ]; then
            echo "Stuck Pages deployment cancelled."
          elif [ "$status" = "404" ]; then
            echo "Previous Pages deployment is already absent; continuing."
          else
            echo "Pages cancellation returned HTTP $status" >&2
            cat "$response_file" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
