name: Deploy Web Overlay Studio
# Retry transient dependency downloads and re-trigger failed web deployment (2026-11-09).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: web-overlay-deployment-v2
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle Betaflight browser decoder
        shell: bash
        run: |
          mkdir -p web/vendor
          # These external downloads occasionally fail transiently on GitHub-hosted runners.
          for attempt in 1 2 3; do
            if git clone --depth 1 https://github.com/betaflight/blackbox-log-viewer.git web/vendor/blackbox; then
              break
            fi
            rm -rf web/vendor/blackbox
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          cd web/vendor/blackbox
          # Install only the parser's build dependencies, not Explorer's entire app.
          printf '%s\n' '{"private":true,"type":"module","dependencies":{"semver":"^7.7.4","esbuild":"^0.25.0"}}' > package.json
          for attempt in 1 2 3; do
            if npm install --no-package-lock --no-audit --no-fund; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          ./node_modules/.bin/esbuild ../../decoder-entry.js --bundle --format=esm --platform=browser --outfile=../../decoder-bundle.js
          cp LICENSE ../../BETAFLLIGHT-GPL-LICENSE.txt
          cd ../..
          rm -rf vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
