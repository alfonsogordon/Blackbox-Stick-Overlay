name: Deploy Web Overlay Studio
# Re-trigger deployment after GitHub Actions internal scheduler error (2026-11-09).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: web-overlay-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle Betaflight browser decoder
        shell: bash
        run: |
          mkdir -p web/vendor
          git clone --depth 1 https://github.com/betaflight/blackbox-log-viewer.git web/vendor/blackbox
          cd web/vendor/blackbox
          npm install --no-save --package-lock=false semver esbuild
          ./node_modules/.bin/esbuild ../../decoder-entry.js --bundle --format=esm --platform=browser --outfile=../../decoder-bundle.js
          cp LICENSE ../../BETAFLLIGHT-GPL-LICENSE.txt
          cd ../..
          rm -rf vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
